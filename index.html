<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentation</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/markdown.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-row">
        <button id="sidebar-toggle" class="icon-btn" aria-label="Sidebar">☰</button>
        <div class="header-text">
          <h1 id="site-title" class="title">Documentation</h1>
          <p class="subtitle">Spaces • Pages • Recherche</p>
        </div>
        <button id="theme-toggle" class="icon-btn" aria-label="Theme">🌙</button>
      </div>
    </div>
  </header>

  <main class="container layout">
    <aside id="sidebar" class="sidebar">
      <div class="panel">
        <div class="panel-title">Navigation</div>
        <input id="search-input" class="input" placeholder="Rechercher..." />
        <div id="sidebar-nav" class="list"></div>
      </div>
    </aside>

    <section class="content">
      <div class="panel">
        <div id="content" class="viewer"></div>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
